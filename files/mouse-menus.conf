# 右键菜单：在 tmux 3.8 默认菜单基础上加 pane/window 互转项，由 ~/.tmux.conf source
# pane 右键（含 Cmd+右键，iTerm2 发给 tmux 的是 M- 版本）：加 Break to Window（把该 pane 拆成 window）
# 右键总是弹 tmux 菜单（默认行为是程序接管鼠标时把右键转发给程序，Claude Code 会接管，导致菜单不弹）
bind-key  -T root MouseDown3Pane display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{==:#{pane_mode},copy-mode},#{?copy_line_numbers,Hide Line Numbers,Show Line Numbers},}" L { send-keys -X line-numbers-toggle } "#{?#{==:#{pane_mode},copy-mode},#{?refresh_active,Refresh Off,Refresh On},}" r { send-keys -X refresh-toggle } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{#{pane_floating_flag}},Move,}" '' { display-menu -T "#[align=centre]Move" -x L -y L Centre c { move-pane -P centre } '' "Top Left" 1 { move-pane -P top-left } "Top Right" 2 { move-pane -P top-right } "Bottom Left" 3 { move-pane -P bottom-left } "Bottom Right" 4 { move-pane -P bottom-right } '' Top t { move-pane -P top-centre } Bottom b { move-pane -P bottom-centre } Left l { move-pane -P centre-left } Right r { move-pane -P centre-right } } "#{?#{#{pane_floating_flag}},Move & Resize,}" '' { display-menu -T "#[align=centre]Move & Resize" -x L -y L Fill 0 { resize-pane -x "100%" -y "100%" ; move-pane -P top-left } '' "Top Left" 1 { resize-pane -x "50%" -y "50%" ; move-pane -P top-left } "Top Right" 2 { resize-pane -x "50%" -y "50%" ; move-pane -P top-right } "Bottom Left" 3 { resize-pane -x "50%" -y "50%" ; move-pane -P bottom-left } "Bottom Right" 4 { resize-pane -x "50%" -y "50%" ; move-pane -P bottom-right } '' Top t { resize-pane -x "100%" -y "50%" ; move-pane -P top-centre } Bottom b { resize-pane -x "100%" -y "50%" ; move-pane -P bottom-centre } Left l { resize-pane -x "50%" -y "100%" ; move-pane -P centre-left } Right r { resize-pane -x "50%" -y "100%" ; move-pane -P centre-right } } "#{?#{#{pane_floating_flag}},Tile,}" t { join-pane } "#{?#{!:#{pane_floating_flag}},Float,}" f { break-pane -W } "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' "#{?#{>:#{window_panes},1},,-}Break to Window" b { break-pane } Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }
bind-key  -T root M-MouseDown3Pane display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{==:#{pane_mode},copy-mode},#{?copy_line_numbers,Hide Line Numbers,Show Line Numbers},}" L { send-keys -X line-numbers-toggle } "#{?#{==:#{pane_mode},copy-mode},#{?refresh_active,Refresh Off,Refresh On},}" r { send-keys -X refresh-toggle } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{#{pane_floating_flag}},Move,}" '' { display-menu -T "#[align=centre]Move" -x L -y L Centre c { move-pane -P centre } '' "Top Left" 1 { move-pane -P top-left } "Top Right" 2 { move-pane -P top-right } "Bottom Left" 3 { move-pane -P bottom-left } "Bottom Right" 4 { move-pane -P bottom-right } '' Top t { move-pane -P top-centre } Bottom b { move-pane -P bottom-centre } Left l { move-pane -P centre-left } Right r { move-pane -P centre-right } } "#{?#{#{pane_floating_flag}},Move & Resize,}" '' { display-menu -T "#[align=centre]Move & Resize" -x L -y L Fill 0 { resize-pane -x "100%" -y "100%" ; move-pane -P top-left } '' "Top Left" 1 { resize-pane -x "50%" -y "50%" ; move-pane -P top-left } "Top Right" 2 { resize-pane -x "50%" -y "50%" ; move-pane -P top-right } "Bottom Left" 3 { resize-pane -x "50%" -y "50%" ; move-pane -P bottom-left } "Bottom Right" 4 { resize-pane -x "50%" -y "50%" ; move-pane -P bottom-right } '' Top t { resize-pane -x "100%" -y "50%" ; move-pane -P top-centre } Bottom b { resize-pane -x "100%" -y "50%" ; move-pane -P bottom-centre } Left l { resize-pane -x "50%" -y "100%" ; move-pane -P centre-left } Right r { resize-pane -x "50%" -y "100%" ; move-pane -P centre-right } } "#{?#{#{pane_floating_flag}},Tile,}" t { join-pane } "#{?#{!:#{pane_floating_flag}},Float,}" f { break-pane -W } "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' "#{?#{>:#{window_panes},1},,-}Break to Window" b { break-pane } Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }
# 菜单项显隐写成 '##{?##{==:#{条件},1},…}'：run-shell -C 先把条件展开成 1/0，display-menu 再判断；
# 不能只写 '##{?#{条件},…}'，展开后成了 #{?1,…}，tmux 把裸的 1/0 当变量名查，永远为假
# 状态栏 session 名右键：session 和 window 标签点击都发 MouseDown3Status，用 mouse_status_range 区分，session 弹 Switch/清 Claude 标记/Rename/Kill/New 菜单（当前 session 的 Kill 置灰）
# window 标签右键（Cmd+右键在 iTerm2 里到 tmux 是 M- 版本）：Join Here 把该 window（全部 pane）并入当前 window；
# 菜单弹在当前 window 上时（点击 / 双击标签会先切过去）换成 Join Into <上一个 window>：把当前 window 并回切换前所在的 window，
# 效果等于在原 window 里右键它选 Join Here；Join Window Here... 复用 prefix @ 从列表里选。合并都走 ~/.config/tmux/bin/join-window
# tmux 3.8 里 display-menu 的目标若是非当前 window 的 pane 就不显示，所以用 run-shell -C 先把 window id 展开，再以当前 window 为目标弹菜单
bind -T root MouseDown3Status if -F '#{==:#{mouse_status_range},session}' { run-shell -C "display-menu -t '=#{client_session}:' -T '#[align=centre]#{session_name}' -x M -y W '##{?##{==:#{==:#{session_name},#{client_session}},1},,Switch To}' s 'switch-client -t #{session_id}' '##{?##{==:#{!=:#{@cc_s},},1},Clear Claude Mark,}' c 'set -u -t #{session_id} @cc_s' '' Rename n 'command-prompt -I \"#{session_name}\" -p \"(rename)\" { rename-session -t #{session_id} -- \"%%\" }' '##{?##{==:#{==:#{session_name},#{client_session}},1},-,}Kill' X 'kill-session -t #{session_id}' '' 'New Session' N 'command-prompt -p \"(new session)\" { new-session -d -s \"%%\" ; switch-client -t \"=%%\" }'" } { run-shell -C "display-menu -t '#{session_id}:' -T '#[align=centre]#{window_index}:#{window_name}' -x M -y W '##{?##{==:#{window_active},1},,Join Here (Side)}' j 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_active,#{window_id},}} -h\"' '##{?##{==:#{window_active},1},,Join Here (Below)}' J 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_active,#{window_id},}} -v\"' '##{?##{==:#{&&:#{window_active},#{W:#{?window_last_flag,1,}}},1},Join Into #{W:#{?window_last_flag,#{window_index}:#{window_name},}} (Side),}' j 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_last_flag,#{window_id},}} -h\"' '##{?##{==:#{&&:#{window_active},#{W:#{?window_last_flag,1,}}},1},Join Into #{W:#{?window_last_flag,#{window_index}:#{window_name},}} (Below),}' J 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_last_flag,#{window_id},}} -v\"' '##{?##{==:#{window_active},1},Join Window Here...,}' a 'send-keys -K -c #{client_name} C-a @' '' Rename n 'command-prompt -p \"(rename)\" { rename-window -t #{window_id} -- \"%%\" }' Kill X 'kill-window -t #{window_id}' '' 'New After' w 'new-window -a -t #{window_id}' 'New At End' W 'new-window'" }
bind -T root M-MouseDown3Status if -F '#{==:#{mouse_status_range},session}' { run-shell -C "display-menu -t '=#{client_session}:' -T '#[align=centre]#{session_name}' -x M -y W '##{?##{==:#{==:#{session_name},#{client_session}},1},,Switch To}' s 'switch-client -t #{session_id}' '##{?##{==:#{!=:#{@cc_s},},1},Clear Claude Mark,}' c 'set -u -t #{session_id} @cc_s' '' Rename n 'command-prompt -I \"#{session_name}\" -p \"(rename)\" { rename-session -t #{session_id} -- \"%%\" }' '##{?##{==:#{==:#{session_name},#{client_session}},1},-,}Kill' X 'kill-session -t #{session_id}' '' 'New Session' N 'command-prompt -p \"(new session)\" { new-session -d -s \"%%\" ; switch-client -t \"=%%\" }'" } { run-shell -C "display-menu -t '#{session_id}:' -T '#[align=centre]#{window_index}:#{window_name}' -x M -y W '##{?##{==:#{window_active},1},,Join Here (Side)}' j 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_active,#{window_id},}} -h\"' '##{?##{==:#{window_active},1},,Join Here (Below)}' J 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_active,#{window_id},}} -v\"' '##{?##{==:#{&&:#{window_active},#{W:#{?window_last_flag,1,}}},1},Join Into #{W:#{?window_last_flag,#{window_index}:#{window_name},}} (Side),}' j 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_last_flag,#{window_id},}} -h\"' '##{?##{==:#{&&:#{window_active},#{W:#{?window_last_flag,1,}}},1},Join Into #{W:#{?window_last_flag,#{window_index}:#{window_name},}} (Below),}' J 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_last_flag,#{window_id},}} -v\"' '##{?##{==:#{window_active},1},Join Window Here...,}' a 'send-keys -K -c #{client_name} C-a @' '' Rename n 'command-prompt -p \"(rename)\" { rename-window -t #{window_id} -- \"%%\" }' Kill X 'kill-window -t #{window_id}' '' 'New After' w 'new-window -a -t #{window_id}' 'New At End' W 'new-window'" }
# 触屏（手机 / iPad 没有右键，双击会被客户端当成自己的手势）：点其他标签照常切换，点当前这个标签弹出和右键相同的菜单
# 先用 run-shell -C 按鼠标目标展开"点的是不是当前项"存进 @tap_cur，再切换，最后按 @tap_cur 决定要不要弹菜单
bind -T root MouseDown1Status run-shell -C "set -g @tap_cur '#{?#{==:#{mouse_status_range},session},#{==:#{session_name},#{client_session}},#{?#{==:#{mouse_status_range},window},#{window_active},0}}'" \; switch-client -t = \; if -F "#{@tap_cur}" { if -F '#{==:#{mouse_status_range},session}' { run-shell -C "display-menu -t '=#{client_session}:' -T '#[align=centre]#{session_name}' -x M -y W '##{?##{==:#{==:#{session_name},#{client_session}},1},,Switch To}' s 'switch-client -t #{session_id}' '##{?##{==:#{!=:#{@cc_s},},1},Clear Claude Mark,}' c 'set -u -t #{session_id} @cc_s' '' Rename n 'command-prompt -I \"#{session_name}\" -p \"(rename)\" { rename-session -t #{session_id} -- \"%%\" }' '##{?##{==:#{==:#{session_name},#{client_session}},1},-,}Kill' X 'kill-session -t #{session_id}' '' 'New Session' N 'command-prompt -p \"(new session)\" { new-session -d -s \"%%\" ; switch-client -t \"=%%\" }'" } { run-shell -C "display-menu -t '#{session_id}:' -T '#[align=centre]#{window_index}:#{window_name}' -x M -y W '##{?##{==:#{window_active},1},,Join Here (Side)}' j 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_active,#{window_id},}} -h\"' '##{?##{==:#{window_active},1},,Join Here (Below)}' J 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_active,#{window_id},}} -v\"' '##{?##{==:#{&&:#{window_active},#{W:#{?window_last_flag,1,}}},1},Join Into #{W:#{?window_last_flag,#{window_index}:#{window_name},}} (Side),}' j 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_last_flag,#{window_id},}} -h\"' '##{?##{==:#{&&:#{window_active},#{W:#{?window_last_flag,1,}}},1},Join Into #{W:#{?window_last_flag,#{window_index}:#{window_name},}} (Below),}' J 'run-shell \"~/.config/tmux/bin/join-window #{window_id} #{W:#{?window_last_flag,#{window_id},}} -v\"' '##{?##{==:#{window_active},1},Join Window Here...,}' a 'send-keys -K -c #{client_name} C-a @' '' Rename n 'command-prompt -p \"(rename)\" { rename-window -t #{window_id} -- \"%%\" }' Kill X 'kill-window -t #{window_id}' '' 'New After' w 'new-window -a -t #{window_id}' 'New At End' W 'new-window'" } }
