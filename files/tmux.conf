# ~/.tmux.conf

# ---------- Shell / 终端 ----------
set -g default-shell /bin/zsh
# 新窗口起非 login shell，避免 macOS path_helper 打乱 PATH
set -g default-command "${SHELL}"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on

# ---------- 前缀与基础 ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# 关掉某个 session 的最后一个 pane 时，切到另一个还在的 session，而不是退出 tmux（关最后一个 session 才退出）
set -g detach-on-destroy off

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ---------- 分屏 / pane ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix x（iTerm2 里 Cmd+W）：前台是空闲 shell 直接关；有程序在跑（claude、vim、ssh…）再按一次 x 确认，按别的键取消
# 只认 shell 白名单：Claude Code 的进程名是版本号（如 2.1.309），按程序名匹配会漏
bind x if -F '#{m/r:^-?(zsh|bash|sh|fish)$,#{pane_current_command}}' 'kill-pane' 'confirm-before -c x -p "kill-pane #P (#{pane_current_command})? [x]" kill-pane'

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window 并入当前 window：@ 左右分屏，# 上下分屏（反向：prefix + ! 把 pane 拆成 window）
bind @ choose-window 'join-pane -h -s "%%"'
bind '#' choose-window 'join-pane -v -s "%%"'

# ---------- 鼠标 / 复制模式 ----------
set -g mouse on
source-file ~/.config/tmux/mouse-menus.conf
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
set -g set-clipboard on
# 滚轮每格滚动行数（默认 5，想快就改大）
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 5 scroll-down

# ---------- 状态栏 ----------
set -g status-position top
set -g status-interval 1   # 1 秒刷新，让 Claude 运行中的转圈动起来
# 左侧列出所有 session（更常用），鼠标点击即可切换（当前 session 绿底）；右侧是 window 列表 + 日期时间
set -g status-left-length 200
# Claude Code 状态（~/.claude/hooks/tmux-cc.sh 汇总到 @cc_s / @cc_w），名字前加彩色徽标，非当前项的名字也染同色：
#   红底 ! = 等你确认    黄底 ✓ = 跑完等你查看    蓝底 ◐◓◑◒ 转圈 = 正在跑    暗蓝底 ◌ = 后台任务在跑
set -g @cc_lang zh   # Claude 提示文字语言（prefix g 列表、等确认提示条）：zh | en
# 转圈帧：按当前秒数 mod 4 选一帧（%S 先被 strftime 展开）
set -g @cc_spin "#{?#{==:#{e|m:%S,4},0},◐,#{?#{==:#{e|m:%S,4},1},◓,#{?#{==:#{e|m:%S,4},2},◑,◒}}}"
set -g @cc_badge_s "#{?#{==:#{@cc_s},ask},#[fg=#000000 bg=#f5a142 bold] ! ,#{?#{==:#{@cc_s},done},#[fg=#95f26b bg=#262626 bold] ✓ ,#{?#{==:#{@cc_s},run},#[fg=#000000 bg=#d97757 bold] #{E:@cc_spin} ,#{?#{==:#{@cc_s},bg},#[fg=#8a8a8a bg=#262626] ◌ ,}}}}"
set -g @cc_name_s "#{?#{==:#{@cc_s},ask},#[fg=#f5a142 bg=default bold],#{?#{==:#{@cc_s},done},#[fg=#95f26b bg=default bold],#{?#{==:#{@cc_s},run},#[fg=#d97757 bg=default nobold],#{?#{==:#{@cc_s},bg},#[fg=#b0b0b0 bg=default nobold],#[fg=#8a8a8a bg=default nobold]}}}}"
set -g @cc_badge_w "#{?#{==:#{@cc_w},ask},#[fg=#000000 bg=#f5a142 bold] ! ,#{?#{==:#{@cc_w},done},#[fg=#95f26b bg=#262626 bold] ✓ ,#{?#{==:#{@cc_w},run},#[fg=#000000 bg=#d97757 bold] #{E:@cc_spin} ,#{?#{==:#{@cc_w},bg},#[fg=#8a8a8a bg=#262626] ◌ ,}}}}"
set -g @cc_name_w "#{?#{==:#{@cc_w},ask},#[fg=#f5a142 bg=default bold],#{?#{==:#{@cc_w},done},#[fg=#95f26b bg=default bold],#{?#{==:#{@cc_w},run},#[fg=#d97757 bg=default nobold],#{?#{==:#{@cc_w},bg},#[fg=#b0b0b0 bg=default nobold],#[fg=#8a8a8a bg=default nobold]}}}}"
# >>> touch >>>
# 触屏客户端（iPad / iPhone 上的 Termius、Blink、code-server 等）：不是 iTerm2，或宽度不到 100 列
set -g @touch "#{||:#{!:#{m:iTerm2*,#{client_termtype}}},#{e|<:#{client_width},100}}"
# prefix Space：常用操作菜单（覆盖默认的 next-layout），按字母或点选；触屏客户端上 F1 也能打开（可放进客户端的自定义按键栏）
# 关 pane、Claude 列表直接复用 prefix x / g / G 的绑定（send-keys -K 当作用户按键处理）
bind Space display-menu -T "#[align=centre]tmux" -x C -y C \
  "New Window"   c { new-window -c "#{pane_current_path}" } \
  "Split Side"   | { split-window -h -c "#{pane_current_path}" } \
  "Split Below"  - { split-window -v -c "#{pane_current_path}" } \
  "#{?window_zoomed_flag,Unzoom,Zoom} Pane" z { resize-pane -Z } \
  "Kill Pane"    x { send-keys -K -c "#{client_name}" C-a x } \
  '' \
  "Next Window"  n { next-window } \
  "Prev Window"  p { previous-window } \
  "Choose Session / Window" s { choose-tree -Zs } \
  "Rename Window" , { command-prompt -I "#W" -p "(rename)" { rename-window -- "%%" } } \
  '' \
  "Claude List"  g { send-keys -K -c "#{client_name}" C-a g } \
  "Next Claude"  G { send-keys -K -c "#{client_name}" C-a G } \
  '' \
  "Scroll Mode"  [ { copy-mode } \
  "Paste"        ] { paste-buffer } \
  "Detach"       d { detach-client }
bind -n F1 if -F "#{E:@touch}" { send-keys -K -c "#{client_name}" C-a Space } { send-keys F1 }
# <<< touch <<<
set -g status-left "#{S:#[range=session|#{session_id}]#{E:@cc_badge_s}#{E:@cc_name_s} #{?#{E:@touch},#{=/6/…:session_name},#{session_name}} #[norange]#[default],#[range=session|#{session_id}]#{E:@cc_badge_s}#[fg=#000000 bg=#95f26b bold] #{session_name} #[norange]#[default]} "
# Claude 账号额度（cc-statusline.sh 实时写入，tmux-cc.sh usage-cache 兜底）：<50 绿 · <80 黄 · ≥80 红并显示重置时间；过了重置时间自动隐藏
set -g @cc_lim "#{?#{&&:#{!=:#{@cc_5h},},#{e|<:%s,#{@cc_5h_ts}}},#[fg=#6b6b6b] 5h #{?#{e|>=:#{@cc_5h},80},#[fg=#ff5f57 bold],#{?#{e|>=:#{@cc_5h},50},#[fg=#f5a142],#[fg=#95f26b]}}#{@cc_5h}%%%%#{?#{e|>=:#{@cc_5h},80}, ↻#{@cc_5h_at},}#[default],}#{?#{&&:#{!=:#{@cc_7d},},#{e|<:%s,#{@cc_7d_ts}}},#[fg=#6b6b6b] 7d #{?#{e|>=:#{@cc_7d},80},#[fg=#ff5f57 bold],#{?#{e|>=:#{@cc_7d},50},#[fg=#f5a142],#[fg=#95f26b]}}#{@cc_7d}%%%%#{?#{e|>=:#{@cc_7d},80}, ↻#{@cc_7d_at},}#[default],} "
# 触屏客户端不显示额度和日期，给 session / window 标签腾地方
set -g status-right "#{?#{E:@touch},,#[fg=#333333]│#{E:@cc_lim}#[fg=#333333]│#[fg=#d0d0d0] %m-%d %H:%M }"
set -g status-right-length 80
set -g status-justify right   # window 列表靠右，紧挨时间
set -g status-style "bg=#000000,fg=#d0d0d0"
setw -g window-status-style "fg=#8a8a8a"
setw -g window-status-current-style "fg=#ffffff,bg=#262626,bold"
setw -g window-status-activity-style "fg=yellow"
# 触屏客户端：非当前 window 名截到 8 个字（当前 window 显示全名）
# 序号暗色、名字亮色；不显示 * / - 标记，pane 放大时显示黄色 Z
setw -g window-status-format "#{E:@cc_badge_w}#{E:@cc_name_w} #[fg=#5a5a5a]#I #{E:@cc_name_w}#{?#{E:@touch},#{=/8/…:window_name},#W}#{?window_zoomed_flag,#[fg=#f5a142] Z,} "
# 当前 window：深灰底 + 绿色序号（当前 session 是绿底，两者区分开）
setw -g window-status-current-format "#{E:@cc_badge_w}#[fg=#95f26b bg=#262626 bold] #I #[fg=#ffffff]#W#{?window_zoomed_flag,#[fg=#f5a142] Z,} "
# window 自动命名：Claude Code（进程名是版本号）用它写进 pane 标题的对话主题，标题还是默认值时用目录名；
# 空闲 shell 用目录名；其他程序用程序名。手动改过名的 window 不受影响
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$|^claude$,#{pane_current_command}},#{?#{m:*Claude Code,#{pane_title}},#{b:pane_current_path},#{=/14/…:#{s/^[^ ]+ //:pane_title}}},#{?#{m/r:^-?(zsh|bash|sh|fish)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}}}#{?pane_dead,[dead],}'
# 状态按 pane 记录再汇总到 window/session（见 tmux-cc.sh）；切到某个 pane 就清掉它的 done，顺便清理残留
set-hook -g client-session-changed "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh focus #{pane_id}'"
set-hook -g session-window-changed "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh focus #{pane_id}'"
set-hook -g after-select-pane      "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh focus #{pane_id}'"
# pane / window / session 被关掉时重新汇总，避免残留标记
set-hook -g pane-exited     "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh gc'"
set-hook -g after-kill-pane "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh gc'"
set-hook -g session-closed  "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh gc'"
# prefix g：fzf 列出所有 Claude（等确认 > 跑完 > 在跑，带输出预览），回车跳过去；prefix G：直接跳到最早等你的那个
bind g run-shell -b "tmux display-popup -c '#{client_name}' -E -w 80% -h 70% -T ' Claude ' \"$HOME/.claude/hooks/tmux-cc.sh jump '#{client_name}'\""
bind G run-shell -b "$HOME/.claude/hooks/tmux-cc.sh next '#{client_name}'"
# prefix v：当前 pane 所在 git 仓库的改动文件 + delta diff 预览，enter 编辑（看 Claude 刚才改了什么）
bind v run-shell -b "tmux display-popup -c '#{client_name}' -d '#{pane_current_path}' -E -w 90% -h 85% -T ' changes ' \"$HOME/.config/tmux/bin/changes '#{pane_current_path}'\""
# prefix e：当前 pane 左侧开关 yazi 文件树侧栏；文本文件在弹窗里用 $EDITOR 打开
bind e run-shell -b "$HOME/.config/tmux/bin/explorer '#{pane_id}' '#{pane_current_path}'"
# prefix u：额度详情 + 最近 7 天每日用量（ccusage），less 翻页，q 关闭
bind u run-shell -b "tmux display-popup -c '#{client_name}' -E -w 90% -h 85% -T ' Claude usage ' \"$HOME/.claude/hooks/tmux-cc.sh usage\""
# 启动时用 ~/.claude.json 的缓存先填上额度，之后由 Claude 的 statusLine 实时更新
run-shell -b '$HOME/.claude/hooks/tmux-cc.sh usage-cache'
set -g window-status-separator ""
# 其余界面和状态栏同一套配色（Moshi App 风格：纯黑底、荧光绿强调、橙色待处理）：pane 边框、提示条、复制模式选中、菜单和弹窗（圆角）
set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#95f26b"
set -g message-style "fg=#ffffff,bg=#262626"
set -g message-command-style "fg=#ffffff,bg=#262626"
setw -g mode-style "fg=#ffffff,bg=#333333"
set -g menu-style "fg=#d0d0d0,bg=#0d0d0d"
set -g menu-selected-style "fg=#000000,bg=#95f26b,bold"
set -g menu-border-style "fg=#333333"
set -g menu-border-lines rounded
set -g popup-border-style "fg=#333333"
set -g popup-border-lines rounded
setw -g monitor-activity on

# ---------- 插件（TPM，prefix + I 安装） ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# 必须放在最后；TPM 未安装时跳过
if-shell "test -d ~/.tmux/plugins/tpm" "run '~/.tmux/plugins/tpm/tpm'"

# 关闭 tmux-sensible 开启的 aggressive-resize，兼容 iTerm2 的 tmux -CC
setw -g aggressive-resize off
