# ~/.tmux.conf

# ---------- Shell / 终端 ----------
set -g default-shell /bin/zsh
# 新窗口起非 login shell，避免 macOS path_helper 打乱 PATH
set -g default-command "${SHELL}"
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on

# ---------- 前缀与基础 ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ---------- 分屏 / pane ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window 并入当前 window：@ 左右分屏，# 上下分屏（反向：prefix + ! 把 pane 拆成 window）
bind @ choose-window 'join-pane -h -s "%%"'
bind '#' choose-window 'join-pane -v -s "%%"'

# ---------- 鼠标 / 复制模式 ----------
set -g mouse on
source-file ~/.config/tmux/mouse-menus.conf
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
set -g set-clipboard on
# 滚轮每格滚动行数（默认 5，想快就改大）
bind -T copy-mode-vi WheelUpPane   select-pane \; send -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X -N 5 scroll-down

# ---------- 状态栏 ----------
set -g status-position top
set -g status-interval 1   # 1 秒刷新，让 Claude 运行中的转圈动起来
# 左侧列出所有 session（更常用），鼠标点击即可切换（当前 session 绿底）；右侧是 window 列表 + 日期时间
set -g status-left-length 200
# Claude Code 状态（~/.claude/hooks/tmux-cc.sh 汇总到 @cc_s / @cc_w），名字前加彩色徽标，非当前项的名字也染同色：
#   红底 ! = 等你确认    黄底 ✓ = 跑完等你查看    蓝底 ◐◓◑◒ 转圈 = 正在跑
# 转圈帧：按当前秒数 mod 4 选一帧（%S 先被 strftime 展开）
set -g @cc_spin "#{?#{==:#{e|m:%S,4},0},◐,#{?#{==:#{e|m:%S,4},1},◓,#{?#{==:#{e|m:%S,4},2},◑,◒}}}"
set -g @cc_badge_s "#{?#{==:#{@cc_s},ask},#[fg=colour231 bg=colour160 bold] ! ,#{?#{==:#{@cc_s},done},#[fg=colour16 bg=colour220 bold] ✓ ,#{?#{==:#{@cc_s},run},#[fg=colour231 bg=colour33 bold] #{E:@cc_spin} ,}}}"
set -g @cc_name_s "#{?#{==:#{@cc_s},ask},#[fg=colour203 bg=default bold],#{?#{==:#{@cc_s},done},#[fg=colour220 bg=default bold],#{?#{==:#{@cc_s},run},#[fg=colour75 bg=default nobold],#[fg=colour244 bg=default nobold]}}}"
set -g @cc_badge_w "#{?#{==:#{@cc_w},ask},#[fg=colour231 bg=colour160 bold] ! ,#{?#{==:#{@cc_w},done},#[fg=colour16 bg=colour220 bold] ✓ ,#{?#{==:#{@cc_w},run},#[fg=colour231 bg=colour33 bold] #{E:@cc_spin} ,}}}"
set -g @cc_name_w "#{?#{==:#{@cc_w},ask},#[fg=colour203 bg=default bold],#{?#{==:#{@cc_w},done},#[fg=colour220 bg=default bold],#{?#{==:#{@cc_w},run},#[fg=colour75 bg=default nobold],#[fg=colour244 bg=default nobold]}}}"
set -g status-left "#{S:#[range=session|#{session_id}]#{E:@cc_badge_s}#{E:@cc_name_s} #{session_name} #[norange]#[default],#[range=session|#{session_id}]#{E:@cc_badge_s}#[fg=black bg=green bold] #{session_name} #[norange]#[default]} "
set -g status-right "#[fg=colour250] %Y-%m-%d %H:%M "
set -g status-justify right   # window 列表靠右，紧挨时间
set -g status-style "bg=colour236,fg=colour250"
setw -g window-status-style "fg=colour244"
setw -g window-status-current-style "fg=black,bg=green,bold"
setw -g window-status-activity-style "fg=yellow"
setw -g window-status-format "#{E:@cc_badge_w}#{E:@cc_name_w} #I:#W#F "
setw -g window-status-current-format "#{E:@cc_badge_w}#[default] #I:#W#F "
# 状态按 pane 记录再汇总到 window/session（见 tmux-cc.sh）；切到某个 pane 就清掉它的 done，顺便清理残留
set-hook -g client-session-changed "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh focus #{pane_id}'"
set-hook -g session-window-changed "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh focus #{pane_id}'"
set-hook -g after-select-pane      "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh focus #{pane_id}'"
# pane / window / session 被关掉时重新汇总，避免残留标记
set-hook -g pane-exited     "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh gc'"
set-hook -g after-kill-pane "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh gc'"
set-hook -g session-closed  "run-shell -b '$HOME/.claude/hooks/tmux-cc.sh gc'"
# prefix g：fzf 列出所有 Claude（等确认 > 跑完 > 在跑，带输出预览），回车跳过去；prefix G：直接跳到最早等你的那个
bind g run-shell -b "tmux display-popup -c '#{client_name}' -E -w 80% -h 70% -T ' Claude ' \"$HOME/.claude/hooks/tmux-cc.sh jump '#{client_name}'\""
bind G run-shell -b "$HOME/.claude/hooks/tmux-cc.sh next '#{client_name}'"
set -g window-status-separator ""
setw -g monitor-activity on

# ---------- 插件（TPM，prefix + I 安装） ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# 必须放在最后；TPM 未安装时跳过
if-shell "test -d ~/.tmux/plugins/tpm" "run '~/.tmux/plugins/tpm/tpm'"

# 关闭 tmux-sensible 开启的 aggressive-resize，兼容 iTerm2 的 tmux -CC
setw -g aggressive-resize off
